name: 打包与发布

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: DMG (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            architecture: arm64
          - runner: macos-26-intel
            architecture: x86_64
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 核对版本与标签
        id: version
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          import re
          from pathlib import Path

          with Path('Resources/Info.plist').open('rb') as source:
              version = plistlib.load(source)['CFBundleShortVersionString']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit(f'应用版本必须是三段数字，例如 0.0.1；实际为 {version!r}')
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              tag = os.environ['GITHUB_REF_NAME']
              if os.environ['GITHUB_REF_TYPE'] != 'tag' or tag != version:
                  raise SystemExit(f'标签 {tag!r} 与应用版本 {version!r} 不一致，停止发布。')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\n')
          print(f'打包版本：{version}')
          PY

      - name: 记录构建环境
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          uname -m

      - name: 运行核心与外观测试
        run: swift test --no-parallel --filter 'CoreTests|DesignSystemTests'

      - name: 构建并校验 DMG
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          ./scripts/build-dmg.sh
          shopt -s nullglob
          images=(build/dist/*.dmg)
          if [[ ${#images[@]} -ne 1 ]]; then
            echo '::error::应当只生成一个 DMG 安装包。'
            exit 1
          fi
          image="${images[0]}"
          case "${image##*/}" in
            "RepHub-${RELEASE_VERSION}-macOS-${TARGET_ARCHITECTURE}-"*.dmg) ;;
            *) echo '::error::安装包版本或实际二进制架构与构建目标不一致。'; exit 1 ;;
          esac
          asset="RepHub-${RELEASE_VERSION}-macOS-${TARGET_ARCHITECTURE}.dmg"
          mv "$image" "build/dist/$asset"
          rm "${image}.sha256"
          (
            cd build/dist
            shasum -a 256 "$asset" > "$asset.sha256"
            shasum -a 256 -c "$asset.sha256"
          )
          {
            echo "### RepHub ${RELEASE_VERSION} · ${TARGET_ARCHITECTURE}"
            echo "- 安装包：\`$asset\`"
            echo "- 源码提交：\`$GITHUB_SHA\`"
            echo '- 应用签名与磁盘映像已由打包脚本校验，SHA-256 已复核。'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 保存安装包与校验文件
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RepHub-${{ steps.version.outputs.version }}-macOS-${{ matrix.architecture }}
          path: |
            build/dist/*.dmg
            build/dist/*.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  release:
    name: 发布 GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出发布说明
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 下载两种架构的安装包
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: RepHub-*-macOS-*
          path: dist
          merge-multiple: true

      - name: 核对产物并发布
        run: |
          assets=()
          for architecture in arm64 x86_64; do
            asset="RepHub-${RELEASE_TAG}-macOS-${architecture}.dmg"
            test -s "dist/$asset"
            test -s "dist/$asset.sha256"
            (cd dist && sha256sum -c "$asset.sha256")
            assets+=("dist/$asset" "dist/$asset.sha256")
          done

          state_file="$RUNNER_TEMP/release-state.txt"
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$state_file"; then
            if [[ "$(cat "$state_file")" != true ]]; then
              echo '::error::该版本已经发布，不覆盖已发布的安装包。请使用新的版本标签。'
              exit 1
            fi
          else
            notes="docs/releases/${RELEASE_TAG}.md"
            if [[ -f "$notes" ]]; then
              gh release create "$RELEASE_TAG" --verify-tag --draft \
                --title "RepHub ${RELEASE_TAG}" --notes-file "$notes"
            else
              gh release create "$RELEASE_TAG" --verify-tag --draft \
                --title "RepHub ${RELEASE_TAG}" --generate-notes
            fi
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
